name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tags

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            asset: Plugins-macOS.zip
          - name: Linux x86_64
            os: ubuntu-22.04 # oldest supported glibc for wider compatibility
            asset: Plugins-Linux-x86_64.zip
          - name: Windows x64
            os: windows-latest
            asset: Plugins-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev \
            libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libcairo2-dev libfreetype6-dev libpango1.0-dev libgtkmm-3.0-dev zip

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -B build -A x64
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      # Building also runs Steinberg's VST3 validator against the plug-in.
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd build/VST3/Release
          ls -d *.vst3
          test -d Simplr.vst3 && test -d Multidyn.vst3 && test -d Lowfocus.vst3
          case "$RUNNER_OS" in
            macOS)   zip -qry "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" Simplr.vst3 Multidyn.vst3 Lowfocus.vst3 ;;
            Linux)   zip -qr "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" Simplr.vst3 Multidyn.vst3 Lowfocus.vst3 ;;
            Windows) pwsh -Command "Compress-Archive -Path Simplr.vst3,Multidyn.vst3,Lowfocus.vst3 -DestinationPath '$GITHUB_WORKSPACE/dist/${{ matrix.asset }}'" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload UI screenshots
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/test-output/**/*.png
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Plugins-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum Plugins-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "Plug-ins $GITHUB_REF_NAME (Simplr, Multidyn, Lowfocus)" \
            --notes "Install with one command:

          **macOS / Linux**
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh | sh
          \`\`\`
          **Windows (PowerShell)**
          \`\`\`
          irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.ps1 | iex
          \`\`\`
          Or download the zip for your platform below and copy the \`.vst3\` folders into your VST3 folder."

  # Runs the real one-line installers against the release that was just published.
  installers:
    name: Installer (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          SIMPLR_REPO: ${{ github.repository }}
          SIMPLR_VERSION: ${{ github.ref_name }}
          SIMPLR_DEST: ${{ runner.temp }}/vst3
        run: |
          sh scripts/install.sh
          for p in Simplr Multidyn Lowfocus; do
            if [ "$RUNNER_OS" = "macOS" ]; then
              test -f "$SIMPLR_DEST/$p.vst3/Contents/MacOS/$p"
              codesign -v "$SIMPLR_DEST/$p.vst3"
            else
              test -f "$SIMPLR_DEST/$p.vst3/Contents/x86_64-linux/$p.so"
            fi
            echo "$p installed"
          done
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIMPLR_REPO: ${{ github.repository }}
          SIMPLR_VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/install.ps1
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Common\VST3'
          if (Test-Path "$env:CommonProgramW6432\VST3\Simplr.vst3") { $root = "$env:CommonProgramW6432\VST3" }
          foreach ($p in 'Simplr', 'Multidyn', 'Lowfocus') {
            if (-not (Test-Path "$root\$p.vst3\Contents\x86_64-win\$p.vst3")) { throw "$p binary missing" }
            Write-Host "$p installed"
          }
