name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Actions > Build > Run workflow: builds the chosen branch; with a version (e.g. v0.7.0) it also
  # publishes that release from it (the tag is created on the commit built), like pushing the tag.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version tag (e.g. v0.7.0); leave empty to only build"
        type: string
        default: ""

permissions:
  contents: write # needed to publish releases on tags

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            asset: Plugins-macOS.zip
          - name: Linux x86_64
            os: ubuntu-22.04 # oldest supported glibc for wider compatibility
            asset: Plugins-Linux-x86_64.zip
          - name: Windows x64
            os: windows-latest
            asset: Plugins-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # (a stalled package mirror once hung this step for over an hour: give up and retry instead)
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev \
            libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libcairo2-dev libfreetype6-dev libpango1.0-dev libgtkmm-3.0-dev zip

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -B build -A x64
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      # Building also runs Steinberg's VST3 validator against the plug-in.
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd build/VST3/Release
          ls -d *.vst3
          test -d Smemplr.vst3 && test -d Multidyn.vst3 && test -d Locus.vst3 && test -d Stretchr.vst3 && test -d Smacheratr.vst3 && test -d Para.vst3 && test -d Widr.vst3 && test -d Wubr.vst3 && test -d Detonatr.vst3 && test -d Levlr.vst3 && test -d Deepr.vst3 && test -d Smoothr.vst3 && test -d Gently.vst3
          case "$RUNNER_OS" in
            macOS)   zip -qry "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" Smemplr.vst3 Multidyn.vst3 Locus.vst3 Stretchr.vst3 Smacheratr.vst3 Para.vst3 Widr.vst3 Wubr.vst3 Detonatr.vst3 Levlr.vst3 Deepr.vst3 Smoothr.vst3 Gently.vst3 ;;
            Linux)   zip -qr "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" Smemplr.vst3 Multidyn.vst3 Locus.vst3 Stretchr.vst3 Smacheratr.vst3 Para.vst3 Widr.vst3 Wubr.vst3 Detonatr.vst3 Levlr.vst3 Deepr.vst3 Smoothr.vst3 Gently.vst3 ;;
            Windows) pwsh -Command "Compress-Archive -Path Smemplr.vst3,Multidyn.vst3,Locus.vst3,Stretchr.vst3,Smacheratr.vst3,Para.vst3,Widr.vst3,Wubr.vst3,Detonatr.vst3,Levlr.vst3,Deepr.vst3,Smoothr.vst3,Gently.vst3 -DestinationPath '$GITHUB_WORKSPACE/dist/${{ matrix.asset }}'" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload UI screenshots
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/test-output/**/*.png
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      TAG: ${{ inputs.release || github.ref_name }}
    steps:
      - name: Version tag
        id: tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'$TAG' is not a version tag like v0.7.0"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Plugins-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum Plugins-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (from the Run workflow button the tag does not exist yet: it is made on the commit built)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "Plug-ins $TAG (Smemplr, Multidyn, Locus, Stretchr, Smacheratr, Para, Widr, Wubr, Detonatr, Levlr, Deepr, Smoothr, Gently)" \
            --notes "Install with one command:

          **macOS / Linux**
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh | sh
          \`\`\`
          **Windows (PowerShell)**
          \`\`\`
          irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.ps1 | iex
          \`\`\`
          Or download the zip for your platform below and copy the \`.vst3\` folders into your VST3 folder."

  installers:
    name: Installers
    needs: release
    uses: ./.github/workflows/installers.yml
    with:
      version: ${{ needs.release.outputs.tag }}
