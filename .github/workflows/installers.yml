name: Installers

# Runs the real one-line installers (from this commit) against a published release on every OS.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to install (e.g. v0.2.0), or latest"
        default: latest
  push:
    branches: [main]
    paths: ["scripts/install.sh", "scripts/install.ps1", ".github/workflows/installers.yml"]

jobs:
  install:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SIMPLR_REPO: ${{ github.repository }}
      SIMPLR_VERSION: ${{ inputs.version || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          SIMPLR_DEST: ${{ runner.temp }}/vst3
        run: |
          # an old top-level copy of ours (must be removed), another vendor's plug-in with one of our
          # names (must stay), and one of ours under a retired name in the vendor folder (must be
          # removed once the release no longer ships that name)
          mkdir -p "$SIMPLR_DEST/Multidyn.vst3/Contents/Resources" "$SIMPLR_DEST/Locus.vst3/Contents/Resources" \
            "$SIMPLR_DEST/bfielstr/Lowfocus.vst3/Contents/Resources"
          echo '{ "Vendor": "Simplr", "Version": "0.1.1.0" }' > "$SIMPLR_DEST/Multidyn.vst3/Contents/Resources/moduleinfo.json"
          echo '{ "Vendor": "Someone Else" }' > "$SIMPLR_DEST/Locus.vst3/Contents/Resources/moduleinfo.json"
          echo '{ "Vendor": "bfielstr", "Version": "0.4.0.0" }' > "$SIMPLR_DEST/bfielstr/Lowfocus.vst3/Contents/Resources/moduleinfo.json"
          sh scripts/install.sh
          test ! -d "$SIMPLR_DEST/Multidyn.vst3"
          test -d "$SIMPLR_DEST/Locus.vst3"
          if [ -d "$SIMPLR_DEST/bfielstr/Locus.vst3" ]; then
            test ! -d "$SIMPLR_DEST/bfielstr/Lowfocus.vst3" # renamed: the old bundle is gone
          fi
          # Multidyn is in every release
          test -d "$SIMPLR_DEST/bfielstr/Multidyn.vst3"
          for b in "$SIMPLR_DEST"/bfielstr/*.vst3; do
            p="$(basename "$b" .vst3)"
            if [ "$RUNNER_OS" = "macOS" ]; then
              test -f "$b/Contents/MacOS/$p"
              codesign -v "$b"
            else
              test -f "$b/Contents/x86_64-linux/$p.so"
            fi
            grep -q '"Vendor": "bfielstr"' "$b/Contents/Resources/moduleinfo.json"
            echo "$p installed"
          done
          # installing again replaces in place
          sh scripts/install.sh | grep -q "Replacing Multidyn"
          # subset install
          rm -rf "$SIMPLR_DEST"
          SIMPLR_PLUGINS="Multidyn" sh scripts/install.sh
          test -d "$SIMPLR_DEST/bfielstr/Multidyn.vst3" && test ! -d "$SIMPLR_DEST/bfielstr/Stretchr.vst3"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SIMPLR_DEST = Join-Path $env:RUNNER_TEMP 'vst3'
          $old = Join-Path $env:SIMPLR_DEST 'Multidyn.vst3\Contents\Resources'
          New-Item -ItemType Directory -Force -Path $old | Out-Null
          '{ "Vendor": "Simplr", "Version": "0.1.1.0" }' | Set-Content (Join-Path $old 'moduleinfo.json')
          $retired = Join-Path $env:SIMPLR_DEST 'bfielstr\Lowfocus.vst3\Contents\Resources'
          New-Item -ItemType Directory -Force -Path $retired | Out-Null
          '{ "Vendor": "bfielstr", "Version": "0.4.0.0" }' | Set-Content (Join-Path $retired 'moduleinfo.json')
          ./scripts/install.ps1
          if (Test-Path (Join-Path $env:SIMPLR_DEST 'Multidyn.vst3')) { throw 'old top-level copy not removed' }
          if (-not (Test-Path (Join-Path $env:SIMPLR_DEST 'bfielstr\Multidyn.vst3'))) { throw 'Multidyn missing' }
          if ((Test-Path (Join-Path $env:SIMPLR_DEST 'bfielstr\Locus.vst3')) -and (Test-Path (Join-Path $env:SIMPLR_DEST 'bfielstr\Lowfocus.vst3'))) {
            throw 'retired Lowfocus bundle not removed'
          }
          Get-ChildItem (Join-Path $env:SIMPLR_DEST 'bfielstr') -Filter '*.vst3' | ForEach-Object {
            $p = $_.Name -replace '\.vst3$', ''
            if (-not (Test-Path "$($_.FullName)\Contents\x86_64-win\$p.vst3")) { throw "$p binary missing" }
            Write-Host "$p installed"
          }
          $again = ./scripts/install.ps1 6>&1 | Out-String
          if ($again -notmatch 'Replacing Multidyn') { throw 'second install did not replace' }
